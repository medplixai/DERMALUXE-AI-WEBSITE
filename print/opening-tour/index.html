<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grand Opening Tour</title>
<style>
  /* Display: Cormorant Garamond (italic for titles, upright for names). UI: Jost.
     Telugu lines need their own script face: Noto Serif Telugu. */
  @font-face { font-family: Display; src: url(fonts/cormorant-italic.ttf) format('truetype'); font-weight: 300 700; }
  @font-face { font-family: Upright; src: url(fonts/cormorant.ttf) format('truetype'); font-weight: 300 700; }
  @font-face { font-family: UI; src: url(fonts/jost.ttf) format('truetype'); font-weight: 100 900; }
  @font-face { font-family: Te; src: url(fonts/telugu.ttf) format('truetype'); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
